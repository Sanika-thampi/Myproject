{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card p-4 fade-in" style="width: 100%; max-width: 400px;">
    <h3 class="text-center text-pink mb-4">📝 Create Account</h3>

    <form method="POST">
      <div class="mb-3">
        <input type="text" name="username" class="form-control text-center bg-dark text-light border-0" placeholder="Create Username" required>
      </div>
      <div class="mb-3">
        <input type="password" name="password" class="form-control text-center bg-dark text-light border-0" placeholder="Create Password" required>
      </div>

      <button type="submit" class="btn btn-custom w-100">Sign Up</button>
    </form>

    <p class="text-center mt-3">
      Already have an account? <a href="{{ url_for('login') }}" class="text-pink text-decoration-none">Login</a>
    </p>
  </div>
</div>
{% endblock %}
